name: Laravel CI/CD

on:
  push:
    branches: [ master, main, develop, qa ]
  pull_request:
    branches: [ master, main, develop, qa ]

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: pcov

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Prepare Enviroment
        run: cp .env.ci .env

      # a. Тесты и Gate 50%
      - name: Run Tests
        [cite_start]run: php artisan test --coverage-clover=clover.xml [cite: 13]

      - name: Check Coverage Gate
        run: |
          # Простая проверка на покрытие выше 50% [cite: 14]
          PERCENT=$(php -r '$xml = simplexml_load_file("clover.xml"); $metrics = $xml->xpath("//metrics"); echo round((double)$metrics[0]["coveredstatements"] / (double)$metrics[0]["statements"] * 100);')
          if [ $PERCENT -lt 50 ]; then echo "Coverage is $PERCENT%, less than 50%"; exit 1; fi

      # b. Статический анализ
      - name: PHPStan
        [cite_start]run: ./vendor/bin/phpstan analyse [cite: 17]

      # c. Линтер (Laravel Pint)
      - name: Pint Linting
        [cite_start]run: ./vendor/bin/pint --test [cite: 21]

  deploy:
    needs: compliance
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    # Ручной аппрув для master 
    environment: 
      name: ${{ github.ref_name == 'master' && 'production' || github.ref_name }}
    
    steps:
      - uses: actions/checkout@v3

      - [cite_start]name: Deploy Simulation [cite: 27]
        run: |
          case "${{ github.ref_name }}" in
            "develop") ENV="dev" ;;
            "qa") ENV="uat" ;;
            "master"|"main") ENV="prod" ;;
          esac
          cp .env.$ENV .env
          echo "Deploying to [$ENV] with .env.$ENV"

      - [cite_start]name: Notify Maintainers [cite: 30]
        if: always()
        run: echo "Pipeline result sent to maintainers"