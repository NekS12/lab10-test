name: Laravel CI/CD

on:
  push:
    branches: [ master, main, develop, qa ]
  pull_request:
    branches: [ master, main, develop, qa ]

jobs:
  compliance:
    runs-on: ubuntu-latest

    # 1. Добавляем сервис MySQL
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: pcov
          extensions: mbstring, dom, fileinfo, mysql # Убедимся, что расширение mysql активно

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Prepare Environment
        run: cp .env.ci .env

      - name: Run Tests
        # 2. Прокидываем данные для подключения к MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
        run: |
          php artisan key:generate --env=testing
          php artisan config:clear
          php artisan migrate --force # Важно: мигрируем базу перед тестами
          php artisan test --coverage-clover=clover.xml

      - name: Check Coverage Gate
        run: |
          PERCENT=$(php -r '$xml = simplexml_load_file("clover.xml"); $metrics = $xml->xpath("//metrics"); echo round((double)$metrics[0]["coveredstatements"] / (double)$metrics[0]["statements"] * 100);')
          if [ $PERCENT -lt 50 ]; then echo "Coverage is $PERCENT%, less than 50%"; exit 1; fi

      - name: PHPStan
        run: vendor/bin/phpstan analyse app tests --memory-limit=2G

      - name: Pint Linting
        run: ./vendor/bin/pint --test

  deploy:
    needs: compliance
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment: 
      name: ${{ github.ref_name == 'master' && 'production' || github.ref_name }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Simulation
        run: |
          case "${{ github.ref_name }}" in
            "develop") ENV="dev" ;;
            "qa") ENV="uat" ;;
            "master"|"main") ENV="prod" ;;
          esac
          if [ -f ".env.$ENV" ]; then
            cp ".env.$ENV" .env
            echo "Deploying to [$ENV] with .env.$ENV"
          else
            echo "Environment file .env.$ENV not found!"
            exit 1
          fi

      - name: Notify Maintainers
        if: always()
        run: echo "Pipeline result sent to maintainers"